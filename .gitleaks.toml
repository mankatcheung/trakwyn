title = "Trakwyn gitleaks config"

[extend]
useDefault = true

# The throwaway values the e2e job writes into apps/api/.env (JEF-477). They
# protect nothing: the job's database and servers live and die with the runner.
[[allowlists]]
description = "e2e placeholder secrets in ci.yml and the guide environment action (JEF-533)"
paths = [
  '''^\.github/workflows/ci\.yml$''',
  '''^\.github/actions/guide-env/action\.yml$''',
]
regexes = ['''e2e-only-[a-z-]+''']
