packages:
  - 'apps/*'
  - 'packages/*'
overrides:
  fast-uri@>=3.0.1 <4.0.0-0: 3.1.7
  undici@>=7.0.0 <8.0.0-0: 7.29.0
  lodash: 4.18.1
  mysql2: 3.24.4
  deepmerge-ts: 8.0.2
  decode-uri-component: 0.5.0
  esbuild@>=0.18.0 <0.19.0-0: 0.25.12
  markdown-it@>=10.0.0 <11.0.0-0: 15.0.2
  linkify-it@>=2.0.0 <3.0.0-0: 6.1.0
  uuid@>=7.0.0 <8.0.0-0: 11.1.1
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  # A transitive dependency of posthog-js (JEF-349). Its postinstall script
  # only prints a sponsorship banner, so it is never run.
  core-js: false
  esbuild: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@prisma/adapter-libsql@7.9.1'
  - '@prisma/client-runtime-utils@7.9.1'
  - '@prisma/client@7.9.1'
  - '@prisma/config@7.9.1'
  - '@prisma/debug@7.9.1'
  - '@prisma/dev@0.24.17'
  - '@prisma/driver-adapter-utils@7.9.1'
  - '@prisma/engines@7.9.1'
  - '@prisma/fetch-engine@7.9.1'
  - '@prisma/get-platform@7.9.1'
  - prisma@7.9.1
