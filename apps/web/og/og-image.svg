<!--
  Source of public/og-image.png, the link-preview card every marketing page
  sends as og:image (JEF-462). Edit this, then run `node og/render.mjs`.

  1200×630 is the size WhatsApp, Slack, LinkedIn and X all render as a large
  landscape card. Everything sits in a centred column no wider than ~600px,
  because some clients crop the card to a near-square around its centre.

  Matches the marketing site (JEF-670, JEF-684): a warm stone ground, the
  ink-blue accent (#1e40af, blue-800) on the mark alone, and medium weights.
  No white tile on a solid blue field.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Flat on purpose: a gradient takes the PNG past WhatsApp's ~300 KB limit. stone-50. -->
  <rect width="1200" height="630" fill="#fafaf9"/>

  <!-- The mark (src/components/LogoMark.tsx) bare, without the app-icon tile. -->
  <g transform="translate(528 100) scale(3)">
    <path d="M11.5 13 L23.5 24 L11.5 35" fill="none" stroke="#1e40af" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <path d="M24.5 13 L36.5 24 L24.5 35" fill="none" stroke="#1e40af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <!-- stone-900 and stone-600 -->
    <text x="600" y="404" font-size="104" font-weight="500" letter-spacing="-2" fill="#1c1917">Trakwyn</text>
    <text x="600" y="476" font-size="42" font-weight="400" fill="#57534e">Your job search, organized</text>
  </g>

  <!-- A hairline in the accent anchors the column without a box. -->
  <rect x="560" y="528" width="80" height="4" rx="2" fill="#1e40af"/>
</svg>
