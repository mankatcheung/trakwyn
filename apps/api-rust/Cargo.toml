[package]
name = "trakwyn-api"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "trakwyn_api"
path = "src/lib.rs"

[[bin]]
name = "trakwyn-api"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
async-graphql = "7"
async-graphql-axum = "7"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15"
hex = "0.4"
hkdf = "0.12"
jsonwebtoken = "9"
krilla = { version = "0.8", default-features = false }
nanoid = "0.4"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
pdf-extract = "0.12"
percent-encoding = "2"
quick-xml = "0.38"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "fs"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ttf-parser = "0.25"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
async-graphql-parser = "7"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
