# F-8 — A failed sign-in shows an error.
#
# Flow 01 only ever signs in successfully. This is the other branch of the same
# screen: the API refusing the credentials must leave the user on the sign-in
# screen with an error, not on the tab bar. Forgot-password is flow 18, so a
# failure in one does not hide the other (JEF-690).
#
# Both assertions are by testID, never by message: the copy is the API's and
# the app's to change (.maestro/README.md, conventions).
#
# No account is registered. An address that was never registered is refused
# with the same error as a wrong password, and skipping the register step
# keeps this the cheapest flow in the suite.
appId: com.trakwyn.app
---
- runFlow: subflows/launch-signed-out.yml

- evalScript: ${output.email = 'e2e-nobody-' + Date.now() + '@example.com'}

- tapOn:
    id: 'login-email-input'
- inputText: ${output.email}
# Close the keyboard before every next field; see subflows/register-new-account.yml.
- pressKey: Enter
- tapOn:
    id: 'login-password-input'
- inputText: 'WrongPassword1!'
- pressKey: Enter
- tapOn:
    id: 'login-submit-button'

- assertVisible:
    id: 'login-error'
- assertVisible:
    id: 'login-email-input'
- assertNotVisible:
    id: 'tab-applications'
