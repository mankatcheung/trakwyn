# F-7 — Signing out leaves nothing behind for the next account.
#
# logout() clears the React Query cache so the next person to sign in on this
# device never sees the last one's applications. That guarantee is currently
# asserted only against a spy on queryClient.clear() in AuthContext.test.tsx —
# here two real accounts share one device and the second must see an empty
# list.
appId: com.trakwyn.app
---
- launchApp:
    clearState: true
- runFlow: subflows/register-new-account.yml

- evalScript: ${output.company = 'Private Co ' + Date.now()}

- tapOn:
    id: 'tab-applications'
- tapOn:
    id: 'add-application-button'
- tapOn:
    id: 'form-company-input'
- inputText: ${output.company}
- tapOn:
    id: 'form-role-input'
- inputText: 'Backend Engineer'
- hideKeyboard
# The form is longer than a small phone's screen and tapOn does not scroll.
- scrollUntilVisible:
    element:
      id: 'form-submit-button'
- tapOn:
    id: 'form-submit-button'
# Saving returns to the dashboard; see 02-register-and-create-application.yml.
- tapOn:
    id: 'tab-applications'
- assertVisible: ${output.company}

- tapOn:
    id: 'tab-settings'
# Sign out is the last row of Settings, below the fold on a small phone.
- scrollUntilVisible:
    element:
      id: 'settings-signout-button'
- tapOn:
    id: 'settings-signout-button'
- assertVisible:
    id: 'login-email-input'

# A second account on the same device, without clearing app state — the cache
# is the only thing standing between it and the first account's data.
- runFlow: subflows/register-new-account.yml
- tapOn:
    id: 'tab-applications'
- assertNotVisible: ${output.company}
