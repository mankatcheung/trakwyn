# F-11 — Star an application, then narrow the list by starred and by search.
#
# Starring is an update mutation, and the starred filter and the search box
# both run against the API's list query, so a list that ignores either one is
# only visible with a real server behind it. Two applications make the
# assertions meaningful: each filter has to keep one row and drop the other.
appId: com.trakwyn.app
---
- runFlow: subflows/launch-signed-out.yml
- runFlow: subflows/register-new-account.yml

- evalScript: ${output.starred = 'Starred Co ' + Date.now()}
- evalScript: ${output.plain = 'Plain Co ' + Date.now()}

- runFlow:
    file: subflows/create-application.yml
    env:
      COMPANY: ${output.starred}
      ROLE: Backend Engineer
- runFlow:
    file: subflows/create-application.yml
    env:
      COMPANY: ${output.plain}
      ROLE: Backend Engineer

- tapOn: '.*${output.starred}.*'
- assertVisible:
    id: 'health-score-card'
- waitForAnimationToEnd
- tapOn:
    id: 'application-detail-star-button'
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'BackButton'

- assertVisible: '.*${output.plain}.*'
- tapOn:
    id: 'applications-filter-starred'
- assertVisible: '.*${output.starred}.*'
- assertNotVisible: '.*${output.plain}.*'
# Switch it off again so the search below is tested on its own.
- tapOn:
    id: 'applications-filter-starred'
- assertVisible: '.*${output.plain}.*'

- tapOn:
    id: 'applications-search-input'
- inputText: ${output.plain}
- pressKey: Enter
- assertVisible: '.*${output.plain}.*'
- assertNotVisible: '.*${output.starred}.*'
