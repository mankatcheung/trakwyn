# F-13 — Add an offer to an application and find it again.
#
# Offers are the last write path of an application's life, and the offer
# mutation is a hand-written document like the others. Two screens read the
# same offer back: the application's own Offers list, and the dashboard's
# all-offers view, which is a different query (it joins the company and role).
appId: com.trakwyn.app
---
- runFlow: subflows/launch-signed-out.yml
- runFlow: subflows/register-new-account.yml

- evalScript: ${output.company = 'Offer Co ' + Date.now()}
- evalScript: ${output.equity = 'Equity' + Date.now()}

- runFlow:
    file: subflows/create-application.yml
    env:
      COMPANY: ${output.company}
      ROLE: Backend Engineer

- tapOn: '.*${output.company}.*'
- assertVisible:
    id: 'health-score-card'
- waitForAnimationToEnd
# Offers is the last row of the section index, below what a small phone shows.
- scrollUntilVisible:
    element:
      id: 'section-index-offers'
- waitForAnimationToEnd
- tapOn:
    id: 'section-index-offers'
- tapOn:
    id: 'add-offer-button'

- tapOn:
    id: 'offer-base-salary-input'
- inputText: '123456'
# The salary field is numeric, and the iOS number pad has no return key, so
# Enter would do nothing there. A tap outside any input closes the keyboard on
# both platforms, and the currency chip is on screen above it. USD is already
# the default, so the tap changes nothing if it does reach the chip.
- tapOn:
    id: 'offer-currency-USD'
# The equity text is what the flow reads back: the salary is formatted by
# locale and would be a fragile thing to match.
- scrollUntilVisible:
    element:
      id: 'offer-equity-input'
- waitForAnimationToEnd
- tapOn:
    id: 'offer-equity-input'
- inputText: ${output.equity}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: 'offer-form-save-button'
- waitForAnimationToEnd
- tapOn:
    id: 'offer-form-save-button'

# Saving pops back to this application's Offers list.
- assertVisible: '.*${output.equity}.*'

# The dashboard's view of the same offer.
- tapOn:
    id: 'tab-home'
- scrollUntilVisible:
    element:
      id: 'dashboard-view-offers'
- waitForAnimationToEnd
- tapOn:
    id: 'dashboard-view-offers'
- assertVisible: '.*${output.company}.*'
