# F-18 — Forgot-password sends a link.
#
# Reaches the one unauthenticated mutation the other flows never call. Split
# from flow 08 (login errors) so that a failed sign-in assertion cannot hide
# this one (JEF-690).
#
# The assertion is by testID, never by message (.maestro/README.md,
# conventions). No account is registered: the API answers the same for an
# address it does not know, so the account existing is not what this asserts;
# the request round-tripping is.
appId: com.trakwyn.app
---
- runFlow: subflows/launch-signed-out.yml

- evalScript: ${output.email = 'e2e-nobody-' + Date.now() + '@example.com'}

# The link sits beside the password label, which a small phone's screen can
# push off the bottom.
- scrollUntilVisible:
    element:
      id: 'login-forgot-password-link'
- waitForAnimationToEnd
- tapOn:
    id: 'login-forgot-password-link'

- tapOn:
    id: 'forgot-password-email-input'
- inputText: ${output.email}
- pressKey: Enter
- tapOn:
    id: 'forgot-password-submit-button'
- assertVisible:
    id: 'forgot-password-success'
