# Launches the app from a clean slate: no data, no session.
#
# On iOS, clearState reinstalls the app but leaves the Keychain alone, and the
# Keychain is where expo-secure-store keeps the session, so the next flow
# opened signed in as the previous flow's user. clearKeychain is iOS-only.
appId: com.trakwyn.app
---
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
