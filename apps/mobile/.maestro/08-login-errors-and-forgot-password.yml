# F-8 — A failed sign-in shows an error, and forgot-password sends a link.
#
# Flow 01 only ever signs in successfully. This is the other branch of the same
# screen: the API refusing the credentials must leave the user on the sign-in
# screen with an error, not on the tab bar. Forgot-password then reaches the
# one unauthenticated mutation the other flows never call.
#
# Both assertions are by testID, never by message: the copy is the API's and
# the app's to change (.maestro/README.md, conventions).
#
# No account is registered. An address that was never registered is refused
# with the same error as a wrong password, and skipping the register step
# keeps this the cheapest flow in the suite.
appId: com.trakwyn.app
---
- runFlow: subflows/launch-signed-out.yml

- evalScript: ${output.email = 'e2e-nobody-' + Date.now() + '@example.com'}

- tapOn:
    id: 'login-email-input'
- inputText: ${output.email}
# Close the keyboard before every next field; see subflows/register-new-account.yml.
- pressKey: Enter
- tapOn:
    id: 'login-password-input'
- inputText: 'WrongPassword1!'
- pressKey: Enter
- tapOn:
    id: 'login-submit-button'

- assertVisible:
    id: 'login-error'
- assertVisible:
    id: 'login-email-input'
- assertNotVisible:
    id: 'tab-applications'

# The link sits beside the password label, which a small phone's screen can
# push off the bottom once the error banner is showing.
- scrollUntilVisible:
    element:
      id: 'login-forgot-password-link'
- waitForAnimationToEnd
- tapOn:
    id: 'login-forgot-password-link'

- tapOn:
    id: 'forgot-password-email-input'
- inputText: ${output.email}
- pressKey: Enter
- tapOn:
    id: 'forgot-password-submit-button'
# The API answers the same for an address it does not know, so the account
# existing is not what this asserts; the request round-tripping is.
- assertVisible:
    id: 'forgot-password-success'
