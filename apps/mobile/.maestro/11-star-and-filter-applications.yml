# F-11 — Star an application, then narrow the list by starred.
#
# Starring is an update mutation, and the starred filter runs against the
# API's list query, so a list that ignores it is only visible with a real
# server behind it. Two applications make the assertions meaningful: the
# filter has to keep one row and drop the other. Search is flow 19, so a
# failure in one does not hide the other (JEF-690).
appId: com.trakwyn.app
---
- runFlow: subflows/launch-signed-out.yml
- runFlow: subflows/register-new-account.yml

- evalScript: ${output.starred = 'Starred Co ' + Date.now()}
- evalScript: ${output.plain = 'Plain Co ' + Date.now()}

- runFlow:
    file: subflows/create-application.yml
    env:
      COMPANY: ${output.starred}
      ROLE: Backend Engineer
- runFlow:
    file: subflows/create-application.yml
    env:
      COMPANY: ${output.plain}
      ROLE: Backend Engineer

- tapOn: '.*${output.starred}.*'
- assertVisible:
    id: 'health-score-card'
- waitForAnimationToEnd
- tapOn:
    id: 'application-detail-star-button'
# Back from the detail screen lands on the dashboard (the detail route
# resolves to (home)'s copy), so go to the Applications tab explicitly.
- tapOn:
    id: 'tab-applications'

- assertVisible: '.*${output.plain}.*'
- tapOn:
    id: 'applications-filter-starred'
- assertVisible: '.*${output.starred}.*'
- assertNotVisible: '.*${output.plain}.*'
- tapOn:
    id: 'applications-filter-starred'
- assertVisible: '.*${output.plain}.*'
