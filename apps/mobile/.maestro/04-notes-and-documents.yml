# F-4 — Notes and documents on an application.
#
# Notes are driven end to end. The document half stops at the picker on
# purpose: expo-document-picker hands off to the OS file picker, whose UI is
# the OEM's and not the app's, so driving it is where this flow would become
# the flaky one that gets re-run on reflex (JEF-300, R-1). Reaching the picker
# still proves the documents screen loads its query and mounts — the upload
# itself (requestUploadUrl -> PUT -> confirmDocument) is covered by
# src/features/documents/hooks/__tests__/useUploadDocument.test.tsx and by
# apps/web's Playwright suite against the same three-step API.
appId: com.trakwyn.app
---
- launchApp:
    clearState: true
- runFlow: subflows/register-new-account.yml

- evalScript: ${output.company = 'Notes Co ' + Date.now()}
- evalScript: ${output.note = 'Phone screen booked ' + Date.now()}

- tapOn:
    id: 'tab-applications'
- tapOn:
    id: 'add-application-button'
- tapOn:
    id: 'form-company-input'
- inputText: ${output.company}
- tapOn:
    id: 'form-role-input'
- inputText: 'Backend Engineer'
- hideKeyboard
- tapOn:
    id: 'form-submit-button'

- tapOn: ${output.company}

# The detail screen is an index of sections (JEF-303); each row drills into
# its own screen.
- tapOn:
    id: 'section-index-notes'

# Notes are added through a modal (JEF-317). Its save button sits in the modal
# header, above the keyboard, so there is no hideKeyboard here — on Android
# that is a back press, which would dismiss the modal instead.
- tapOn:
    id: 'add-note-button'
- tapOn:
    id: 'note-modal-input'
- inputText: ${output.note}
- tapOn:
    id: 'note-modal-save'
- assertVisible: ${output.note}

- back
- tapOn:
    id: 'section-index-documents'
- assertVisible:
    id: 'pick-document-button'
