# F-2 — Register, then create an application.
#
# The first write path through a real resolver, on the mutation the app depends
# on most. This is the flow that catches GraphQL document drift (G-3) from the
# outside: the create mutation is hand-written in
# src/features/applications/graphql/operations.ts and nothing in the Jest tiers
# ever sends it to a server.
appId: com.trakwyn.app
---
- launchApp:
    clearState: true
- runFlow: subflows/register-new-account.yml

- evalScript: ${output.company = 'Acme ' + Date.now()}

- tapOn:
    id: 'tab-applications'
- tapOn:
    id: 'add-application-button'

- tapOn:
    id: 'form-company-input'
- inputText: ${output.company}
- tapOn:
    id: 'form-role-input'
- inputText: 'Backend Engineer'
- hideKeyboard
- tapOn:
    id: 'form-submit-button'

# Asserted by text, deliberately: this is the one thing in the flow that must
# have round-tripped through the API rather than merely rendered.
- assertVisible: ${output.company}
