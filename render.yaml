# Render Blueprint for apps/api — https://render.com/docs/blueprint-spec
#
# Lives at the repo root because that's where Render looks for a Blueprint
# by default. Defines the API web service plus the admin cron jobs that
# replace Vercel Cron's path-triggered `crons` block (formerly
# apps/api/vercel.json, removed in JEF-334). To apply: connect this file as a
# Blueprint in the Render dashboard (New -> Blueprint), then set the
# production secrets listed in apps/api/.env.example on the trakwyn-api web
# service (they're intentionally not committed here).
services:
  - type: web
    name: trakwyn-api
    runtime: node
    plan: starter
    region: frankfurt
    # Deploys are triggered by CI's deploy-api job through the service's
    # deploy hook, after tests and migrate-db pass. Render's default
    # deploy-on-push would ship a commit before either has run.
    autoDeploy: false
    # corepack honours the root package.json's `packageManager` pin. The
    # install runs with NODE_ENV=development because NODE_ENV=production
    # (set below for runtime) makes pnpm skip devDependencies, and the build
    # needs TypeScript.
    buildCommand: >-
      corepack enable &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @trakwyn/api build
    # Plain node rather than `pnpm start`, so the running service doesn't
    # depend on the corepack shim surviving from build to runtime.
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Everything else (DATABASE_URL, JWT_SECRET, CRON_SECRET, CORS_ORIGIN,
      # COOKIE_DOMAIN, ...) is set directly in the Render dashboard — see
      # apps/api/.env.example for the full list.

  # Vercel Cron couldn't send custom headers, so CRON_SECRET was invented as
  # a reserved env var name Vercel auto-injected as a bearer token. Render
  # Cron Jobs run an arbitrary command instead, so each job below just curls
  # the route with that same secret — same auth check on the API side
  # (isAuthorizedCronTrigger in src/http/routes/cronAuth.ts), just triggered
  # differently.
  - type: cron
    name: trakwyn-api-digest-send
    runtime: node
    plan: starter
    region: frankfurt
    schedule: '0 9 * * *'
    buildCommand: 'true'
    startCommand: >-
      curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET"
      "https://$API_HOST/admin/digest/send"
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: trakwyn-api
          property: host
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: trakwyn-api-reminders-send
    runtime: node
    plan: starter
    region: frankfurt
    schedule: '0 9 * * *'
    buildCommand: 'true'
    startCommand: >-
      curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET"
      "https://$API_HOST/admin/reminders/send"
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: trakwyn-api
          property: host
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: trakwyn-api-trash-purge
    runtime: node
    plan: starter
    region: frankfurt
    schedule: '0 9 * * *'
    buildCommand: 'true'
    startCommand: >-
      curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET"
      "https://$API_HOST/admin/trash/purge"
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: trakwyn-api
          property: host
      - key: CRON_SECRET
        sync: false

  # NOTE: not part of the original Vercel Cron block (apps/api/vercel.json
  # only ever scheduled the three jobs above), even though this route
  # requires the same CRON_SECRET and follows the identical pattern
  # (src/http/routes/pushNotifications.routes.ts). Added here so the
  # migration doesn't silently drop scheduled push delivery — but the
  # schedule below is a guess (matched to the other jobs' cadence, not a
  # known requirement). Confirm the intended cadence before relying on this.
  - type: cron
    name: trakwyn-api-push-notifications-send
    runtime: node
    plan: starter
    region: frankfurt
    schedule: '0 9 * * *'
    buildCommand: 'true'
    startCommand: >-
      curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET"
      "https://$API_HOST/admin/push-notifications/send"
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: trakwyn-api
          property: host
      - key: CRON_SECRET
        sync: false
