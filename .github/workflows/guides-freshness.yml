name: Guide freshness

# Weekly check that every guide still matches the app (JEF-533). It runs each
# guide script (JEF-532) in capture mode against the seeded demo account. No
# Claude: this is plain Playwright and costs nothing beyond CI minutes.
#
# - A guide whose steps still run but whose screenshots changed has its images
#   refreshed in one PR on `chore/guide-screenshots`.
# - A guide whose steps break gets one `guide-outdated` issue, unless one is
#   already open for that slug. A broken step usually means a real UI change a
#   person should describe, so nothing is rewritten automatically.
#
# Contract with JEF-532: `pnpm guides:capture <slug>` runs one guide, rewrites its
# images and exits non-zero when a step fails.
#
# PRs and issues are opened with a GitHub App token (GUIDES_APP_ID and
# GUIDES_APP_PRIVATE_KEY), because a PR opened with GITHUB_TOKEN does not start
# ci.yml, so `ci-ok` (gitleaks, guides-verify) would never run on it. Only the
# `chore/guide-screenshots` branch is pushed, never main.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guides-freshness
  cancel-in-progress: false

jobs:
  freshness:
    name: Capture every guide
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Mint a GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GUIDES_APP_ID }}
          private-key: ${{ secrets.GUIDES_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-project

      - uses: ./.github/actions/guide-env

      - name: Capture each guide
        id: capture
        run: |
          mkdir -p "$RUNNER_TEMP/guide-errors"
          failed=()
          for dir in content/guides/en/*/; do
            slug=$(basename "$dir")
            echo "::group::$slug"
            if ! pnpm guides:capture "$slug" 2>&1 | tee "$RUNNER_TEMP/guide-errors/$slug.log"; then
              failed+=("$slug")
            fi
            echo "::endgroup::"
          done
          printf '%s\n' "${failed[@]}" | jq -R . | jq -sc 'map(select(. != ""))' > "$RUNNER_TEMP/failed.json"
          echo "failed=$(cat "$RUNNER_TEMP/failed.json")" >> "$GITHUB_OUTPUT"

      # The Playwright traces and failure screenshots the issues link to.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guide-capture-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/guide-errors/
          if-no-files-found: ignore

      # Images only: a guide that failed halfway may have left a partial set,
      # so its folder is restored before anything is committed.
      - name: Open or update the screenshot PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FAILED: ${{ steps.capture.outputs.failed }}
        run: |
          for slug in $(jq -r '.[]' <<<"$FAILED"); do
            git checkout -- "content/guides/en/$slug"
            git clean -fdq -- "content/guides/en/$slug"
          done
          if [ -z "$(git status --porcelain -- content/guides)" ]; then
            echo "::notice::No screenshot changed"
            exit 0
          fi
          branch=chore/guide-screenshots
          git config user.name "trakwyn-guides[bot]"
          git config user.email "trakwyn-guides[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/guides
          git commit -m "chore(content): refresh guide screenshots"
          # Only this branch, never main.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          gh label create content --repo "$GITHUB_REPOSITORY" --force >/dev/null
          if [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq length)" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base "${{ github.event.repository.default_branch }}" --head "$branch" \
              --title "chore(content): refresh guide screenshots" --label content \
              --body "The weekly freshness check (guides-freshness.yml) captured these screenshots again and they differ from main. Open the changed images and check each still shows what its guide says."
          fi

      - name: Open an issue for each broken guide
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FAILED: ${{ steps.capture.outputs.failed }}
        run: |
          gh label create guide-outdated --repo "$GITHUB_REPOSITORY" --force >/dev/null
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for slug in $(jq -r '.[]' <<<"$FAILED"); do
            title="Guide outdated: $slug"
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label guide-outdated --state open \
              --json title --jq "[.[] | select(.title == \"$title\")] | length")
            if [ "$existing" != "0" ]; then
              echo "::notice::An issue is already open for $slug"
              continue
            fi
            {
              echo "The weekly freshness check could not run the steps of \`content/guides/en/$slug\`. The app has probably changed under the guide."
              echo
              echo "- Run: $run_url (the \`guide-capture-artifacts\` artifact has the trace and screenshots)"
              echo
              echo '```'
              tail -n 40 "$RUNNER_TEMP/guide-errors/$slug.log"
              echo '```'
              echo
              echo "Update \`guide.ts\` and the text to match the app, then run \`pnpm guides:capture $slug\`."
            } > "$RUNNER_TEMP/issue-body.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label guide-outdated --body-file "$RUNNER_TEMP/issue-body.md"
          done
