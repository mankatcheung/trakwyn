name: CI & Deploy

# Consolidated workflow: CI runs for every PR and push to main. On push to
# main, deploy-api and deploy-web run only after quality, build-test, and
# e2e all pass. apps/api deploys to Google Cloud Run (infra/gcp/, JEF-335);
# apps/web deploys to Vercel.
#
# Why three files became one:
#   - Removed duplicate test gates (CI tests once, deploy reuses result)
#   - Eliminated boilerplate (setup-project, vercel-deploy-production)
#   - Hard guarantee: deploy never starts before tests pass (needs:)
#
# Path filtering on push keeps unrelated changes from triggering a full
# workflow run (e.g. docs-only PRs skip CI). On push, both deploy jobs
# fire when their relevant paths change. If only api files changed, the
# web deploy still runs — that's a minor waste, but Vercel's cache makes
# it fast, and the simplicity gain is worth it.
#
# One-time setup required before this workflow can deploy:
#   1. apps/api: follow infra/gcp/README.md (bootstrap, secrets, terraform
#      apply). Then add repository *variables* (Settings > Secrets and
#      variables > Actions > Variables) from its terraform outputs:
#      GCP_PROJECT_ID, GCP_WIF_PROVIDER (workload_identity_provider),
#      GCP_DEPLOYER_SA (deployer_service_account). No GCP key is stored:
#      deploy-api authenticates through Workload Identity Federation, which
#      only accepts workflows running on this repository's main branch.
#   2. apps/web: the Vercel project's settings, domains and production env
#      vars are Terraform (infra/vercel/, after infra/posthog/, JEF-363);
#      follow infra/vercel/README.md. It stays disconnected from this repo
#      on purpose, so only deploy-web deploys it.
#   3. Add repo secrets for deploy-web: VERCEL_TOKEN (a Vercel access
#      token), VERCEL_ORG_ID and VERCEL_WEB_PROJECT_ID (the team_id and
#      project_id in infra/vercel's terraform.tfvars).
#   4. Add repository secrets (in GitHub Settings > Secrets > Actions):
#      PRODUCTION_DATABASE_URL — the production Neon Postgres *direct*
#        (non-pooled) connection string, with ?sslmode=require
#      NTFY_TOPIC — ntfy.sh topic that receives a push notification once
#        both apps finish deploying to production

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-test-${{ runner.os }}-

      - run: pnpm build
      - run: pnpm test

  terraform:
    name: Terraform fmt & validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [infra/gcp, infra/axiom, infra/posthog, infra/vercel]
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - run: terraform fmt -check -recursive
      # No backend and no credentials: validate checks the configuration
      # against the provider schema only. `plan` needs GCP access, which
      # Workload Identity Federation grants to main-branch workflows alone,
      # so it is run by hand (infra/gcp/README.md). The other roots also
      # need their provider token, which CI deliberately does not hold.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  api-image:
    name: API image builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect API changes
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/${BASE_REF}...HEAD" -- apps/api package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "api=false" >> "$GITHUB_OUTPUT"
          else
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.api == 'true'

      # Build only, so a Dockerfile or dependency change that breaks the image
      # fails on the PR rather than in deploy-api after merge.
      - uses: docker/build-push-action@v6
        if: steps.changes.outputs.api == 'true'
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

  e2e:
    name: Playwright E2E
    needs: [quality, build-test]
    runs-on: ubuntu-latest
    # A real Postgres rather than PGlite, so the API under test talks to the
    # database through the same `pg` pool production uses (unit and
    # integration tests already cover PGlite).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trakwyn
          POSTGRES_PASSWORD: trakwyn
          POSTGRES_DB: trakwyn_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trakwyn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm --filter @trakwyn/web exec playwright install --with-deps chromium

      - name: Configure ephemeral E2E environment
        run: |
          cat > apps/api/.env <<'EOF'
          PORT=3001
          NODE_ENV=development
          DATABASE_URL=postgres://trakwyn:trakwyn@localhost:5432/trakwyn_e2e
          JWT_SECRET=e2e-only-jwt-secret
          JWT_REFRESH_SECRET=e2e-only-refresh-secret
          TOTP_ENCRYPTION_KEY=e2e-only-totp-encryption-key
          LLM_API_KEY_ENCRYPTION_KEY=e2e-only-llm-encryption-key
          STORAGE_PROVIDER=local
          CACHE_PROVIDER=memory
          EMAIL_PROVIDER=console
          CORS_ORIGIN=http://localhost:3000
          WEB_APP_ORIGIN=http://localhost:3000
          API_ORIGIN=http://localhost:3001
          COOKIE_DOMAIN=
          GOOGLE_OAUTH_CLIENT_ID=e2e-fake-google-client-id
          GITHUB_OAUTH_CLIENT_ID=e2e-fake-github-client-id
          OAUTH_PROVIDER_MODE=fake
          LLM_PROVIDER_MODE=fake
          EOF

          cat > apps/web/.env <<'EOF'
          VITE_API_URL=/graphql
          EOF

      - name: Run database migrations
        run: pnpm --filter @trakwyn/api db:migrate:apply

      - name: Run Playwright tests
        run: pnpm --filter @trakwyn/web test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  migrate-db:
    name: Run database migrations
    needs: [quality, build-test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Run Drizzle migrations
        env:
          # Neon's *direct* URL, not the -pooler one — see src/migrate.ts.
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter @trakwyn/api db:migrate:apply

  deploy-api:
    name: Deploy api to Cloud Run
    needs: [quality, build-test, migrate-db, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets google-github-actions/auth request the GitHub OIDC token it
      # exchanges for short-lived GCP credentials.
      id-token: write
    env:
      REGION: europe-west1
      REGISTRY: europe-west1-docker.pkg.dev
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/trakwyn/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

      # Changes the image only; every other setting stays as infra/gcp
      # declares it. skip_default_labels keeps the action's labels off the
      # service, which Terraform would otherwise report as drift.
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: trakwyn-api
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          skip_default_labels: true

  deploy-web:
    name: Deploy web to Vercel
    needs: [quality, build-test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - uses: ./.github/actions/vercel-deploy-production
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

  notify-deploy:
    name: Notify production deploy via ntfy
    needs: [deploy-api, deploy-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BODY=$(printf '%s\n%s' "$COMMIT_MESSAGE" "$COMMIT_URL")
          curl -sS \
            -H "Title: Production updated (${SHORT_SHA})" \
            -H "X-Click: ${COMMIT_URL}" \
            -d "$BODY" \
            "https://ntfy.sh/${NTFY_TOPIC}"
