name: CI & Deploy

# Consolidated workflow: CI runs for every PR and push to main. On push to
# main, deploy-api and deploy-web run only after quality, build-test, and
# e2e all pass.
#
# Why three files became one:
#   - Removed duplicate test gates (CI tests once, deploy reuses result)
#   - Eliminated boilerplate (setup-project, vercel-deploy-production)
#   - Hard guarantee: deploy never starts before tests pass (needs:)
#
# Path filtering on push keeps unrelated changes from triggering a full
# workflow run (e.g. docs-only PRs skip CI). On push, both deploy jobs
# fire when their relevant paths change. If only api files changed, the
# web deploy still runs — that's a minor waste, but Vercel's cache makes
# it fast, and the simplicity gain is worth it.
#
# apps/api deploys to Render, apps/web stays on Vercel (JEF-334).
#
# One-time setup required before this workflow can deploy:
#   1. apps/web (Vercel): create a Vercel project (from repo root, run
#      `vercel link` for apps/web). Do NOT connect it to this GitHub repo in
#      the Vercel dashboard (Settings -> Git) — leaving it disconnected stops
#      Vercel's own integration from also deploying. Set Settings -> Build &
#      Deployment -> Root Directory to apps/web. `vercel link` writes
#      .vercel/project.json (gitignored) containing orgId/projectId — copy
#      those into the repo secrets below. Set the project's production env
#      vars in the Vercel dashboard.
#   2. apps/api (Render): create a Render Blueprint from render.yaml
#      (New -> Blueprint in the Render dashboard, pointed at this repo).
#      Set the trakwyn-api web service's production env vars in the Render
#      dashboard (see apps/api/.env.example for the full list) and the
#      CRON_SECRET env var on each of the four trakwyn-api-*-send/purge cron
#      jobs it creates. Grab a deploy hook URL for the trakwyn-api web
#      service (Settings -> Deploy Hook) — deploys are triggered from this
#      workflow via that hook rather than Render's own auto-deploy-on-push
#      (disabled with `autoDeploy: false` in render.yaml), to keep the same
#      "never deploy before tests pass" guarantee the Vercel deploy had.
#   3. Create a Vercel access token (https://vercel.com/account/tokens) and
#      add repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_WEB_PROJECT_ID.
#   4. Add repository secrets (in GitHub Settings > Secrets > Actions):
#      RENDER_API_DEPLOY_HOOK_URL — the trakwyn-api web service's deploy hook
#      PRODUCTION_DATABASE_URL — the libsql:// URL for your production Turso DB
#      PRODUCTION_DATABASE_AUTH_TOKEN — the auth token for the production Turso DB
#      NTFY_TOPIC — ntfy.sh topic that receives a push notification once
#        both apps finish deploying to production

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'render.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-test-${{ runner.os }}-

      - run: pnpm build
      - run: pnpm test

  e2e:
    name: Playwright E2E
    needs: [quality, build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm --filter @trakwyn/web exec playwright install --with-deps chromium

      - name: Configure ephemeral E2E environment
        run: |
          cat > apps/api/.env <<'EOF'
          PORT=3001
          NODE_ENV=development
          DATABASE_URL=file:${{ runner.temp }}/trakwyn-e2e.db
          DATABASE_AUTH_TOKEN=
          JWT_SECRET=e2e-only-jwt-secret
          JWT_REFRESH_SECRET=e2e-only-refresh-secret
          TOTP_ENCRYPTION_KEY=e2e-only-totp-encryption-key
          LLM_API_KEY_ENCRYPTION_KEY=e2e-only-llm-encryption-key
          STORAGE_PROVIDER=local
          CACHE_PROVIDER=memory
          EMAIL_PROVIDER=console
          CORS_ORIGIN=http://localhost:3000
          WEB_APP_ORIGIN=http://localhost:3000
          API_ORIGIN=http://localhost:3001
          COOKIE_DOMAIN=
          GOOGLE_OAUTH_CLIENT_ID=e2e-fake-google-client-id
          GITHUB_OAUTH_CLIENT_ID=e2e-fake-github-client-id
          OAUTH_PROVIDER_MODE=fake
          LLM_PROVIDER_MODE=fake
          EOF

          cat > apps/web/.env <<'EOF'
          VITE_API_URL=/graphql
          EOF

      - name: Run database migrations
        run: pnpm --filter @trakwyn/api db:migrate:apply

      - name: Run Playwright tests
        run: pnpm --filter @trakwyn/web test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  migrate-db:
    name: Run database migrations
    needs: [quality, build-test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.PRODUCTION_DATABASE_AUTH_TOKEN }}
        run: pnpm --filter @trakwyn/api db:migrate:apply

  deploy-api:
    name: Deploy api to Render
    needs: [quality, build-test, migrate-db, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/render-deploy-production
        with:
          deploy-hook-url: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}

  deploy-web:
    name: Deploy web to Vercel
    needs: [quality, build-test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - uses: ./.github/actions/vercel-deploy-production
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

  notify-deploy:
    name: Notify production deploy via ntfy
    needs: [deploy-api, deploy-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BODY=$(printf '%s\n%s' "$COMMIT_MESSAGE" "$COMMIT_URL")
          curl -sS \
            -H "Title: Production updated (${SHORT_SHA})" \
            -H "X-Click: ${COMMIT_URL}" \
            -d "$BODY" \
            "https://ntfy.sh/${NTFY_TOPIC}"
