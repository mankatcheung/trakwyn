name: CI & Deploy

# Consolidated workflow: CI runs for every PR and push to main. On push to
# main, deploy-api and deploy-web run only after quality, build, test,
# mobile-integration and e2e all pass. apps/api deploys to Google Cloud Run
# (infra/gcp/, JEF-335); apps/web deploys to Vercel.
#
# Why three files became one:
#   - Removed duplicate test gates (CI tests once, deploy reuses result)
#   - Eliminated boilerplate (setup-project, vercel-deploy-production)
#   - Hard guarantee: deploy never starts before tests pass (needs:)
#
# What runs (JEF-476):
#   - A pull request runs only the jobs its files can affect (`changes`), and
#     `ci-ok` is the one check branch protection requires. A job skipped on
#     purpose passes it; a failed or cancelled one does not.
#   - A push to main runs every job, whatever its files are. Runs on main are
#     queued one at a time (see `concurrency` below), and a queued run is
#     replaced by a newer one, so a diff-based skip could drop the changes of
#     the run that was replaced. Running everything makes the newest run
#     deploy all that is on main.
#   - The jobs that build and test do not wait for each other, only deploys
#     wait for all of them. The push `paths` filter below still keeps
#     docs-only pushes from starting a run.
#   - deploy-api sends no traffic to a new revision until it has answered
#     /ready and a GraphQL query, and deploy-web restores the previous
#     production deployment when the site does not answer. notify-deploy
#     reports a failed run as well as a successful one.
#
# One-time setup required before this workflow can deploy:
#   1. apps/api: follow infra/gcp/README.md (bootstrap, secrets, terraform
#      apply). Then add repository *variables* (Settings > Secrets and
#      variables > Actions > Variables) from its terraform outputs:
#      GCP_PROJECT_ID, GCP_WIF_PROVIDER (workload_identity_provider),
#      GCP_DEPLOYER_SA (deployer_service_account). No GCP key is stored:
#      deploy-api authenticates through Workload Identity Federation, which
#      only accepts workflows running on this repository's main branch.
#      GCP_PROJECT_ID and GCP_WIF_PROVIDER stay repository-wide, because the
#      pull-request jobs (api-image, e2e) read them too; GCP_DEPLOYER_SA goes
#      in the `production` environment (step 4), which no pull request can
#      reach.
#   2. apps/web: the Vercel project's settings, domains and production env
#      vars are Terraform (infra/vercel/, after infra/posthog/, JEF-363);
#      follow infra/vercel/README.md. It stays disconnected from this repo
#      on purpose, so only deploy-web deploys it.
#   3. Create the `production` environment (Settings > Environments). The
#      deploy jobs (migrate-db, deploy-api, deploy-web) run in it, so each
#      deploy shows under the repository's Deployments, and the secrets and
#      variables below live there rather than repository-wide (JEF-479). It
#      needs no approval rule or branch restriction to work; add a required
#      reviewer later to gate deploys. The environment claim does not affect
#      GCP: infra/gcp/wif.tf trusts the `ref` claim, which stays
#      refs/heads/main.
#   4. Add secrets to the `production` environment:
#      PRODUCTION_DATABASE_URL — the production Neon Postgres *direct*
#        (non-pooled) connection string, with ?sslmode=require. Its host
#        is infra/neon's `host` output (JEF-379).
#      VERCEL_TOKEN (a Vercel access token), VERCEL_ORG_ID and
#        VERCEL_WEB_PROJECT_ID (the team_id and project_id in infra/vercel's
#        terraform.tfvars) for deploy-web.
#      and the *variable* GCP_DEPLOYER_SA (step 1). Then delete the
#      repository-level copies of all of these.
#   5. Add the repository *secret* NTFY_TOPIC — the ntfy.sh topic that
#      receives a push notification when a run on main finishes, whether the
#      deploys succeeded or not. It stays repository-wide: notify-deploy has
#      to report a deploy that never got as far as the environment. Also add
#      the repository *variable* WEB_URL, the production site's public URL
#      (https://www.trakwyn.com). deploy-web smoke tests it and rolls the
#      deploy back when it does not answer; without it the check is skipped
#      with a warning.
#   6. In Settings > Branches, require the `ci-ok` check on main and drop the
#      per-job checks it replaces.

on:
  push:
    branches: [main]
    # The '!' entries are the only files the release PRs (release.yml,
    # JEF-389) edit under apps/api, apps/web and apps/mobile. They must come
    # after the globs they carve out of, or the negation has no effect, and no
    # comment may sit inside the list (releaseVersioning.test.ts parses it).
    # A dependency change in apps/mobile/package.json still runs CI through
    # pnpm-lock.yaml.
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - '!apps/api/version.txt'
      - '!apps/api/CHANGELOG.md'
      - '!apps/web/version.txt'
      - '!apps/web/CHANGELOG.md'
      - '!apps/mobile/package.json'
      - '!apps/mobile/CHANGELOG.md'
  pull_request:
    branches: [main]

# A pull request cancels its own older run. Runs on main are queued instead,
# one at a time and never cancelled once started, so two quick merges cannot
# deploy at the same moment and an older commit cannot finish after a newer
# one. A run still waiting when a newer push arrives is replaced by it
# (GitHub keeps one pending run per group); the newer run has everything the
# replaced one had. The ref alone is not the key: see the note on migrate-db.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  # Which parts of the repository a pull request touches, so the jobs that
  # cannot be affected are skipped (JEF-476). On a push to main every output
  # is true: see the header for why main never skips.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter lists a pull request's files through the API.
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
      api: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.api }}
      mobile: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.mobile }}
      infra: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.infra }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'infra/base-images.txt'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '*.json'
              - '*.js'
              - '*.mjs'
              - '*.ts'
              - '.nvmrc'
              - '.npmrc'
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'infra/base-images.txt'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  # Always runs: it is the quickest job, and Prettier checks documentation
  # too, so a docs-only pull request still needs it.
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  # build, test and mobile-integration do not wait for each other (JEF-478).
  # `pnpm test` has no `dependsOn: build` in turbo.json, @trakwyn/ui is
  # consumed from src, and the integration tier boots the API with tsx, so none
  # of them needs what `build` produces.
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      # The Clipper's build refuses to run without an API URL (wxt.config.ts).
      # Nothing here talks to it, so a placeholder in its own .env keeps the
      # variable out of the web build's environment. The `test` job never
      # creates it: the extension's tests expect the dev default (localhost)
      # that a set variable would override.
      - run: printf 'VITE_API_URL=https://api.example.test/graphql\nVITE_WEB_URL=https://www.example.test\n' > apps/extension/.env
      - run: pnpm build
      # `pnpm build` builds the Clipper for Chrome; build the Safari bundle
      # too (JEF-386). Wrapping it in the Xcode app needs macOS, so that part
      # stays local (apps/extension/scripts/package-safari.sh).
      - run: pnpm --filter @trakwyn/extension build:safari

  test:
    name: Unit & component tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-

      - run: pnpm test

  # Separate from `test` because it boots apps/api itself (jest.config.js's
  # integration project, globalSetup) — it is what validates apps/mobile's 96
  # hand-written GraphQL documents against the real schema, so a renamed
  # resolver field fails here instead of on a phone (JEF-300, G-3/G-5).
  # Skipped on a pull request that touches neither the app nor the API.
  mobile-integration:
    name: Mobile integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - run: pnpm --filter @trakwyn/mobile test:integration

  terraform:
    name: Terraform fmt & validate (${{ matrix.root }})
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        root:
          - infra/gcp
          - infra/axiom
          - infra/posthog
          - infra/vercel
          - infra/cloudflare
          - infra/brevo
          - infra/upstash
          - infra/neon
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - run: terraform fmt -check -recursive
      # No backend and no credentials: validate checks the configuration
      # against the provider schema only. `plan` needs GCP access, which
      # Workload Identity Federation grants to main-branch workflows alone,
      # so it is run by hand (infra/gcp/README.md). The other roots also
      # need their provider token, which CI deliberately does not hold.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  api-image:
    name: API image builds
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # google-github-actions/auth exchanges the GitHub OIDC token for the
      # read-only CI reader's credentials (JEF-407).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The base image comes from our own Artifact Registry, not a public
      # registry that rate-limits shared runner IPs (JEF-406, JEF-407).
      - uses: ./.github/actions/base-images
        with:
          project-id: ${{ vars.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_READER_SA }}

      - uses: docker/setup-buildx-action@v3

      # Build only, so a Dockerfile or dependency change that breaks the image
      # fails on the PR rather than in deploy-api after merge.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          build-args: NODE_IMAGE=${{ env.NODE_IMAGE }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

  # Starts at once, without waiting for quality, build or test: it installs and
  # builds its own stack and uses nothing they produce. The deploy jobs still
  # wait for all three.
  e2e:
    name: Playwright E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/base-images
        with:
          project-id: ${{ vars.GCP_PROJECT_ID }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
          service-account: ${{ vars.GCP_CI_READER_SA }}
          preload: postgres

      # A real Postgres rather than PGlite, so the API under test talks to the
      # database through the same `pg` pool production uses (unit and
      # integration tests already cover PGlite). Started here rather than as a
      # `services:` container: those are pulled before any step runs, so they
      # cannot use the registry login above, and the mirror is what keeps this
      # pull clear of public-registry rate limits (JEF-407).
      - name: Start Postgres
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=trakwyn -e POSTGRES_PASSWORD=trakwyn -e POSTGRES_DB=trakwyn_e2e \
            -p 5432:5432 "$POSTGRES_IMAGE"
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U trakwyn -d trakwyn_e2e && exit 0
            sleep 2
          done
          docker logs postgres
          echo "::error::Postgres did not become ready"
          exit 1

      - uses: ./.github/actions/setup-project

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: pnpm --filter @trakwyn/web exec playwright install --with-deps chromium

      - name: Configure ephemeral E2E environment
        run: |
          cat > apps/api/.env <<'EOF'
          PORT=3001
          NODE_ENV=development
          DATABASE_URL=postgres://trakwyn:trakwyn@localhost:5432/trakwyn_e2e
          JWT_SECRET=e2e-only-jwt-secret
          JWT_REFRESH_SECRET=e2e-only-refresh-secret
          TOTP_ENCRYPTION_KEY=e2e-only-totp-encryption-key
          LLM_API_KEY_ENCRYPTION_KEY=e2e-only-llm-encryption-key
          STORAGE_PROVIDER=local
          CACHE_PROVIDER=memory
          EMAIL_PROVIDER=console
          CORS_ORIGIN=http://localhost:3000
          WEB_APP_ORIGIN=http://localhost:3000
          API_ORIGIN=http://localhost:3001
          COOKIE_DOMAIN=
          GOOGLE_OAUTH_CLIENT_ID=e2e-fake-google-client-id
          GITHUB_OAUTH_CLIENT_ID=e2e-fake-github-client-id
          OAUTH_PROVIDER_MODE=fake
          LLM_PROVIDER_MODE=fake
          EOF

          cat > apps/web/.env <<'EOF'
          VITE_API_URL=/graphql
          EOF

      - name: Run database migrations
        run: pnpm --filter @trakwyn/api db:migrate:apply

      - name: Run Playwright tests
        run: pnpm --filter @trakwyn/web test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore

  # Supply-chain and secret checks on a pull request (JEF-477). They read the
  # PR's own changes, so a push to main skips them (`ci-ok` counts a skip as a
  # pass); CodeQL has its own workflow (codeql.yml).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reads .gitleaks.toml at the repository root.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The one check branch protection requires (JEF-476). A job skipped on
  # purpose by `changes` passes; a failed or cancelled one does not, and a
  # failed `changes` fails it too.
  ci-ok:
    name: ci-ok
    needs:
      [
        changes,
        quality,
        build,
        test,
        mobile-integration,
        terraform,
        api-image,
        e2e,
        dependency-review,
        secret-scan,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the jobs it waited for
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            echo "::error::A required job failed or was cancelled"
            exit 1
          fi

  migrate-db:
    name: Run database migrations
    needs: [quality, build, test, mobile-integration, e2e]
    # A push to main, and nothing else. The ref alone is not enough: for a
    # pull request that has already been merged, GitHub reports the base
    # branch as github.ref, so a pull_request run that starts just after its
    # PR merges would pass `github.ref == 'refs/heads/main'` and deploy. That
    # happened once (#933), bypassing the push `paths` filter above. The
    # three jobs below repeat the same condition.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds PRODUCTION_DATABASE_URL, and puts the run under Deployments.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - name: Run Drizzle migrations
        env:
          # Neon's *direct* URL, not the -pooler one — see src/migrate.ts.
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter @trakwyn/api db:migrate:apply

  deploy-api:
    name: Deploy api to Cloud Run
    needs: [quality, build, test, mobile-integration, migrate-db, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds GCP_DEPLOYER_SA, and puts the run under Deployments.
    environment: production
    permissions:
      contents: read
      # Lets google-github-actions/auth request the GitHub OIDC token it
      # exchanges for short-lived GCP credentials.
      id-token: write
    env:
      REGION: europe-west1
      REGISTRY: europe-west1-docker.pkg.dev
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/trakwyn/api:${{ github.sha }}
      SERVICE: trakwyn-api
      # Names the new revision's test URL (https://<tag>---<service>-…run.app).
      REVISION_TAG: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # The deployer account can read the base-images repo, so the build uses
      # the same mirrored, digest-pinned node image as the PR check (JEF-407).
      - name: Resolve the mirrored node image
        env:
          DEST: ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/base-images
        run: echo "NODE_IMAGE=$(.github/scripts/base-image-ref.sh node "$DEST")" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            APP_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

      # Changes the image only; every other setting stays as infra/gcp
      # declares it. skip_default_labels keeps the action's labels off the
      # service, which Terraform would otherwise report as drift. The revision
      # gets a tag and no traffic: it is tested below, and only then promoted.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          skip_default_labels: true
          no_traffic: true
          tag: ${{ env.REVISION_TAG }}

      - uses: google-github-actions/setup-gcloud@v2

      # Calls the revision on its own tag URL while the old one still serves
      # everyone. A failure stops here, so a revision that cannot reach its
      # database or build its schema never receives traffic (JEF-476).
      - name: Smoke test the new revision
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          service_url="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --format 'value(status.url)')"
          .github/scripts/smoke-test.sh api "https://${REVISION_TAG}---${service_url#https://}"

      # --no-traffic left the service pinned to the previous revision;
      # --to-latest makes it follow the newest one again.
      - name: Send traffic to the new revision
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --to-latest

      # Terraform does not declare the tag, so a tag left on the service would
      # show as drift in the next `terraform plan`. Best effort: a tag that
      # stays is untidy, not a failed deploy.
      - name: Remove the test tag
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --remove-tags "$REVISION_TAG" ||
            echo "::warning::Could not remove the revision tag $REVISION_TAG"

  deploy-web:
    name: Deploy web to Vercel
    needs: [quality, build, test, mobile-integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the VERCEL_* secrets, and puts the run under Deployments.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-project

      - uses: ./.github/actions/vercel-deploy-production
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          smoke-url: ${{ vars.WEB_URL }}

  # Reports how the run ended, success or failure. `!cancelled()` rather than
  # `always()`: it runs after a failed job but not when someone cancels the
  # run. Not gated on the deploys passing, or a failed deploy would be silent.
  notify-deploy:
    name: Notify production deploy via ntfy
    needs: [quality, build, test, mobile-integration, e2e, migrate-db, deploy-api, deploy-web]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NEEDS: ${{ toJSON(needs) }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          FAILED="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")"
          if [ -n "$FAILED" ]; then
            TITLE="Production deploy FAILED (${SHORT_SHA})"
            BODY=$(printf 'Failed: %s\n%s\n%s' "$FAILED" "$COMMIT_MESSAGE" "$RUN_URL")
            curl -sS \
              -H "Title: ${TITLE}" \
              -H "Priority: high" \
              -H "Tags: rotating_light" \
              -H "X-Click: ${RUN_URL}" \
              -d "$BODY" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          else
            BODY=$(printf '%s\n%s' "$COMMIT_MESSAGE" "$COMMIT_URL")
            curl -sS \
              -H "Title: Production updated (${SHORT_SHA})" \
              -H "X-Click: ${COMMIT_URL}" \
              -d "$BODY" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi
