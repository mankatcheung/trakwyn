name: Mobile E2E (iOS)

# The same Maestro flows as the Android job in mobile-e2e-android.yml, on a simulator.
#
# Kept out of the per-PR path on purpose (JEF-300, D-2): an iOS build is Xcode's
# to do and macOS runners queue longer, so this job costs an estimated 20-30
# minutes against Android's 12-18. Both now run nightly, and
# can be pulled into any single PR by adding the `run-ios-e2e`
# label to it.
#
# It lives in its own file rather than as another job in ci.yml because ci.yml
# deploys. Its deploy jobs are gated to pushes to main, so a schedule there
# would no longer ship production, but a nightly trigger does not belong in the
# deploy workflow, and every other job in it would run each night too.
#
# Free on GitHub's hosted runners while mankatcheung/trakwyn is public —
# including macos, which is otherwise the metered one.

on:
  schedule:
    # 03:00 UTC, after the day's merges have settled.
    - cron: '0 3 * * *'
  workflow_dispatch:
  # No pull_request trigger while the mobile app is unreleased: the job only
  # ever showed as skipped (or action_required on release-please PRs). Restore
  # `pull_request` (branches: [main], types: [opened, synchronize, reopened,
  # labeled]) to bring back the `run-ios-e2e` label.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e-ios:
    name: Mobile E2E (iOS simulator)
    # Pinned, not macos-latest: every run regenerates the native project from
    # scratch, so the Xcode version is part of this job's contract (R-4).
    # macos-15 tops out at Xcode 16.x, which cannot resolve Expo SDK 57's
    # package dependencies; macos-26 ships Xcode 26, selected explicitly below
    # so an image update cannot move it underneath us.
    runs-on: macos-26
    # The Xcode build alone has taken from 30 to 69 minutes (54, 61 and 69 on
    # 19-20 Nov) and has twice outrun the limit then in force: a 60-minute limit
    # cancelled the job before any flow ran, and 90 cancelled the 20 Nov nightly
    # partway through the flows. The rest of the job needs about 25 minutes, so
    # 120 leaves room for a build of up to about 95 (JEF-664).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - uses: ./.github/actions/setup-project

      # PGlite commits with fsync, and on this runner's virtual disk every
      # write-heavy request (registration above all) took 13-17s against well
      # under 1s on the Linux runner with the same API, long enough to outlast
      # both Maestro's wait and the app's 20s request timeout. A RAM disk takes
      # the disk out of it; the migrate step and the API both use this path.
      - name: Put the E2E database on a RAM disk
        run: |
          device=$(hdiutil attach -nomount ram://2097152 | awk '{print $1}')
          diskutil erasevolume APFS trakwyn-e2e "$device"

      # Facts about the machine this run landed on (JEF-662). The hosted macOS
      # pool is shared, and when a flow fails at sign-up these are what a slow
      # run is compared against. Uploaded with the other artifacts and shown on
      # the job page.
      - name: Record runner details
        run: |
          {
            echo "started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            sw_vers
            echo "cpu: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) logical cores"
            echo "memory: $(($(sysctl -n hw.memsize) / 1073741824)) GiB"
            xcodebuild -version | head -2
            xcrun simctl list runtimes | grep -i "iOS"
            echo "database disk:"
            df -h /Volumes/trakwyn-e2e
          } 2>&1 | tee "${{ runner.temp }}/runner-details.txt"

      - name: Configure ephemeral E2E environment
        run: |
          cat > apps/api/.env <<'EOF'
          PORT=3001
          NODE_ENV=development
          DATABASE_URL=pglite:/Volumes/trakwyn-e2e/pglite
          JWT_SECRET=e2e-only-jwt-secret
          JWT_REFRESH_SECRET=e2e-only-refresh-secret
          TOTP_ENCRYPTION_KEY=e2e-only-totp-encryption-key
          LLM_API_KEY_ENCRYPTION_KEY=e2e-only-llm-encryption-key
          STORAGE_PROVIDER=local
          CACHE_PROVIDER=memory
          EMAIL_PROVIDER=console
          CORS_ORIGIN=http://localhost:3000
          WEB_APP_ORIGIN=http://localhost:3000
          API_ORIGIN=http://localhost:3001
          COOKIE_DOMAIN=
          GOOGLE_OAUTH_CLIENT_ID=e2e-fake-google-client-id
          GITHUB_OAUTH_CLIENT_ID=e2e-fake-github-client-id
          OAUTH_PROVIDER_MODE=fake
          LLM_PROVIDER_MODE=fake
          SEARCH_PROVIDER=fake
          EOF

      - name: Run database migrations
        run: pnpm --filter @trakwyn/api db:migrate:apply

      - name: Start the API
        run: |
          pnpm --filter @trakwyn/api dev > "${{ runner.temp }}/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -X POST -H 'content-type: application/json' \
              -d '{"query":"{ __typename }"}' http://localhost:3001/graphql >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the API never answered on :3001"
          cat "${{ runner.temp }}/api.log"
          exit 1

      # A simulator shares the host's network, so unlike the Android job this
      # one reaches the API on plain localhost. That difference is the whole
      # reason the two platforms need two builds: src/constants.ts's
      # EXPO_PUBLIC_API_URL is inlined by Metro at build time, not read at
      # launch, so it cannot be switched afterwards.
      #
      # `expo run:ios` does prebuild, pod install, the Xcode build, and the
      # install onto a booted simulator in one command — the pieces that would
      # otherwise be four brittle steps of xcodebuild and simctl.
      - name: Build and install on a simulator
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3001/graphql
        # After installing, `expo run:ios` also opens the app through
        # `simctl openurl`, which has timed out on a busy runner (code 60)
        # after a good build and install. Maestro launches the app itself, so
        # only that last part is allowed to fail: the step still fails unless
        # the app is really installed, and a fresh runner has nothing
        # installed beforehand.
        run: |
          if ! pnpm exec expo run:ios --configuration Release --no-bundler; then
            echo "::warning::expo run:ios exited non-zero; checking whether the app was installed anyway"
          fi
          xcrun simctl get_app_container booted com.trakwyn.app

      # iOS spots a sign-up form (an email and two secure fields) and swaps the
      # keyboard for its "Automatic Strong Password" view, which swallows what
      # Maestro types: the register flow ended with a short password and an
      # empty confirmation. Turn Password AutoFill off in the simulator's
      # configuration profile, the setting Settings > Passwords writes, and
      # reboot so it takes effect. Real users keep AutoFill; only this
      # throwaway simulator loses it. Which of these plists exist depends on
      # the iOS runtime, so every one that does is updated.
      - name: Turn off Password AutoFill on the simulator
        run: |
          udid=$(xcrun simctl list devices booted -j | jq -r '[.devices[][] | select(.state == "Booted")][0].udid')
          dir="$HOME/Library/Developer/CoreSimulator/Devices/$udid/data/Containers/Shared/SystemGroup/systemgroup.com.apple.configurationprofiles/Library/ConfigurationProfiles"
          updated=0
          for f in UserSettings.plist EffectiveUserSettings.plist PublicInfo/PublicEffectiveUserSettings.plist; do
            if [ -f "$dir/$f" ]; then
              plutil -replace restrictedBool.allowPasswordAutoFill.value -bool NO "$dir/$f"
              updated=1
            fi
          done
          if [ "$updated" != 1 ]; then
            echo "::error::no configuration profile plist under $dir"
            exit 1
          fi
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # See the flow's header: absorbs the simulator's and Maestro's first-run
      # cost so the timed flows below do not pay it.
      - name: Warm up the simulator
        run: maestro test apps/mobile/.maestro/warm-up/first-launch.yml

      # The API has sat idle for the whole Xcode build by now, and on this
      # runner its first sign-up afterwards has taken 18s or more, longer than
      # a flow waits. The launch above never makes the API write anything, so
      # do one throwaway sign-up here, with the mutation the app itself sends
      # (RegisterMobile in src/auth/AuthContext.tsx).
      - name: Warm up the API
        run: |
          response=$(curl -sS --max-time 120 -w '\n%{time_total}s' \
            -H 'Content-Type: application/json' \
            -d '{"query":"mutation RegisterMobile($email: String!, $password: String!) { registerMobile(email: $email, password: $password) { accessToken } }","variables":{"email":"warm-up@example.com","password":"CorrectHorseBatteryStaple1!"}}' \
            http://localhost:3001/graphql)
          echo "$response" | tail -n 1
          if ! echo "$response" | grep -q '"accessToken"'; then
            echo "::error::the warm-up sign-up did not return a token"
            echo "$response"
            exit 1
          fi

      # Ten more sign-ups straight after the warm-up, timed from the client the
      # way the app sees them (JEF-662). The warm-up shows the first one is
      # fast; these show whether slow ones happen on a passing run too. Nothing
      # here can fail the job.
      - name: Time sign-ups
        continue-on-error: true
        run: |
          : > "${{ runner.temp }}/signup-timing.txt"
          for i in $(seq 1 10); do
            email="timing-$i-$(date +%s)@example.com"
            seconds=$(curl -sS --max-time 60 -o /dev/null -w '%{time_total}' \
              -H 'Content-Type: application/json' \
              -d "{\"query\":\"mutation RegisterMobile(\$email: String!, \$password: String!) { registerMobile(email: \$email, password: \$password) { accessToken } }\",\"variables\":{\"email\":\"$email\",\"password\":\"CorrectHorseBatteryStaple1!\"}}" \
              http://localhost:3001/graphql || echo "failed")
            echo "$(date -u +%H:%M:%S) sign-up $i: ${seconds}s" | tee -a "${{ runner.temp }}/signup-timing.txt"
          done

      # Load, memory, the database disk and the busiest processes every ten
      # seconds while the flows run (JEF-662), so a flow that fails at sign-up
      # can be lined up with what the machine was doing. Like the API above,
      # this keeps running after the step ends.
      - name: Sample the runner's load
        run: |
          (
            while true; do
              {
                echo "--- $(date -u +%H:%M:%S) load: $(uptime | sed 's/.*load averages*: //')"
                top -l 2 -s 1 -n 0 | grep -E '^(CPU usage|PhysMem)' | tail -2
                df -k /Volumes/trakwyn-e2e | tail -1
                ps -Ao pcpu,rss,comm -r | head -6
              } >> "${{ runner.temp }}/runner-load.log" 2>&1
              sleep 9
            done
          ) > /dev/null 2>&1 &

      - name: Run the Maestro flows
        run: maestro test apps/mobile/.maestro --debug-output "${{ runner.temp }}/maestro-debug"

      # On every outcome, as the Android job does: a green run's logs are the
      # baseline a red one is read against (JEF-662).
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          # Maestro writes its screenshots and hierarchy dumps under a hidden
          # .maestro/tests/ tree, which upload-artifact skips by default (the
          # Android job has the same setting).
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/maestro-debug/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/runner-details.txt
            ${{ runner.temp }}/signup-timing.txt
            ${{ runner.temp }}/runner-load.log
          if-no-files-found: ignore

      # The same facts on the job page, so a run can be read without opening
      # the artifact: the runner, the sign-up timings and the slowest requests
      # the API served (completion time and milliseconds).
      - name: Summarize the run
        if: always()
        run: |
          {
            echo "### iOS E2E diagnostics"
            echo
            echo "Runner:"
            echo '```'
            cat "${{ runner.temp }}/runner-details.txt" 2>/dev/null || echo "(not recorded)"
            echo '```'
            echo
            echo "Sign-ups timed after the warm-up:"
            echo '```'
            cat "${{ runner.temp }}/signup-timing.txt" 2>/dev/null || echo "(not recorded)"
            echo '```'
            echo
            echo "Slowest API requests (completed at, ms):"
            echo '```'
            perl -pe 's/\e\[[0-9;]*m//g' "${{ runner.temp }}/api.log" 2>/dev/null |
              awk '/^\[[0-9:]+\] INFO: request completed/ {t=$1} /responseTime:/ {printf "%s %d\n", t, $2}' |
              sort -k2 -n -r | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
