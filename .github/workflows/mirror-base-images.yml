name: Mirror base images

# Copies the images pinned in infra/base-images.txt into our own Artifact
# Registry repo, so CI never pulls them from a registry whose rate limit is
# shared with other runners (JEF-406). Only this workflow touches the public
# registry, and only when a pin changes, so a 429 here delays a base-image
# bump instead of failing CI or a deploy.
#
# It runs on main only: Workload Identity Federation (infra/gcp/wif.tf) hands
# out tokens to refs/heads/main and nothing else, deliberately.
on:
  push:
    branches: [main]
    paths:
      - 'infra/base-images.txt'
      - '.github/scripts/mirror-base-images.sh'
      - '.github/workflows/mirror-base-images.yml'
  workflow_dispatch:
  schedule:
    # Weekly, to put back anything the repo lost (it is idempotent: a copy of
    # a digest that is already there changes nothing).
    - cron: '17 4 * * 1'

concurrency:
  group: mirror-base-images
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror pinned images
    # workflow_dispatch can be started from any branch; the credentials would
    # not be issued off main anyway, so fail early with a clear reason.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: europe-west1-docker.pkg.dev
      DEST: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/base-images
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # No setup-buildx-action: it would start a BuildKit container from an
      # anonymous Docker Hub pull (JEF-409). `docker buildx imagetools` talks to
      # the registries directly and runs on the runner's default builder.
      - name: Copy and verify pinned images
        run: .github/scripts/mirror-base-images.sh infra/base-images.txt "$DEST"
