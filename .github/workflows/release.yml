name: Release

# Versions the artefacts people install: the Clipper (apps/extension), the
# mobile app (apps/mobile) and the CLI (apps/cli), plus the server stack,
# apps/api and apps/web, which share one version through the linked-versions
# plugin (JEF-389). The pair is released as `simple`, so a release PR edits
# version.txt and CHANGELOG.md, never package.json, and ci.yml negates those
# four files (and mobile's, which it also watches) in its push paths. The
# plugin titles that PR "release server libraries" and release-please reads a
# merged PR's title back with group-pull-request-title-pattern; if the two
# differ it creates no api/web tag and stops updating the other release PRs. The server version labels changelogs and gives
# self-hosters something to pin to; the commit SHA still identifies what is
# live.
#
# On every push to main, release-please reads the squash-commit titles since
# each package's last release and opens or updates one release PR per package
# (`fix` is a patch, `feat` a minor, `!` or BREAKING CHANGE a major). A commit
# belongs to a package by the files it touches, not by the scope in its title.
# Merging a release PR bumps that package's package.json and CHANGELOG.md,
# and this workflow then creates the tag (e.g. clipper-v1.1.0) and the GitHub
# Release. Only a Clipper release goes on to `clipper-chrome-zip` (JEF-419): it
# builds the zip from the tag, checks the manifest (including that no
# permission or content-script host was added since the previous release),
# attaches the zip to the GitHub Release and starts clipper-cws.yml, which
# uploads it to the Chrome Web Store and submits it for review (JEF-429, JEF-480).
# Approval publishes it to everyone, with no further step (DEFAULT_PUBLISH;
# apps/extension/CLAUDE.md, "Releasing the Clipper"). A Clipper release also
# runs `clipper-firefox-zip` (JEF-437), which
# builds and checks the Firefox zips from the same tag, with the same
# nothing-added check, and starts clipper-amo.yml, which submits them to AMO
# with no manual step either (JEF-458). Nothing else is built or submitted to a
# store here.
#
# The packages and their starting versions are in release-please-config.json
# and .release-please-manifest.json. None of the files a release PR touches
# is in ci.yml's push paths, so merging one does not deploy the API or web
# (held by releaseVersioning.test.ts).
#
# One-time setup: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests". Without it the
# job fails when it tries to open the release PR.
#
# PRs opened with GITHUB_TOKEN do not start other workflows, so ci.yml cannot
# run on a release PR (JEF-479). The `release-pr-ci` job below posts the
# `ci-ok` status on it instead, by a documented rule: it passes only when the
# PR edits nothing but the files release-please writes (version.txt,
# package.json, CHANGELOG.md and the manifest), none of which ci.yml deploys
# on. Branch protection can therefore require `ci-ok` without a release PR
# being stuck. Pass a GitHub App token as `token` instead, and delete that
# job, if CI should really run on release PRs.

on:
  push:
    branches: [main]
  # Runs the Clipper store jobs again for a tag that already exists (JEF-454),
  # with this workflow file as it is now. Re-running a failed job would use the
  # file of the commit it first ran on, so a fix to a store job could not
  # release that tag. release-please does not run, so nothing is tagged or
  # versioned here.
  workflow_dispatch:
    inputs:
      clipper_tag:
        description: Existing Clipper release tag to build and submit, e.g. clipper-v1.2.0
        required: true

# issues: release-please tracks a release PR's state with labels.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PRs, tags and GitHub Releases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      clipper_released: ${{ steps.release.outputs['apps/extension--release_created'] }}
      clipper_tag: ${{ steps.release.outputs['apps/extension--tag_name'] }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Gives each release PR the `ci-ok` check that branch protection requires
  # (JEF-479); see the note at the top of this file for why ci.yml cannot.
  # A commit status is matched by name like a check run, so it satisfies the
  # requirement. The rule is on the PR's files, not its branch name: anything
  # outside what release-please writes gets a failing `ci-ok`, so a release PR
  # someone has pushed code to still needs a person and a real CI run.
  release-pr-ci:
    name: ci-ok for release PRs
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRS: ${{ needs.release-please.outputs.prs }}
      # What a release PR may edit: each versioned app's version file and
      # changelog, and the manifest. The server pair has no package.json
      # entry, because that file would deploy. None of these runs ci.yml on a
      # push (releaseVersioning.test.ts).
      ALLOWED: '^(apps/(api|web)/(version\.txt|CHANGELOG\.md)|apps/(cli|extension|mobile)/(package\.json|CHANGELOG\.md)|\.release-please-manifest\.json)$'
    steps:
      - name: Post ci-ok
        run: |
          for number in $(jq -r '.[].number' <<<"$PRS"); do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" -q .head.sha)
            other=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number/files" --paginate -q '.[].filename' \
              | grep -Ev "$ALLOWED" || true)
            if [ -z "$other" ]; then
              state=success
              description="Release PR: edits only release-managed files, so CI has nothing to run"
            else
              state=failure
              description="Release PR edits files CI must check; run CI by hand"
              echo "::error::PR #$number edits files outside the release set: $other"
            fi
            gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$state" -f context=ci-ok -f description="$description"
          done

  # Runs only when this push released the Clipper, so an API, web, mobile or CLI
  # release skips it. Builds from the tag release-please just created, never
  # from the pushed commit, and with the API URL from the CLIPPER_API_URL
  # repository variable rather than the default compiled into the source. The
  # store rejects a version number it has seen, so the checks run before the
  # upload. The zip is attached to the GitHub Release and clipper-cws.yml, which
  # keeps the Web Store secrets in the `chrome` environment, submits it for
  # review (JEF-480); once approved it is published with no further step
  # (--chrome-publish-type DEFAULT_PUBLISH). Nobody reads the package first, so
  # the guard step below is the only check on what grew. The submission is its
  # own workflow so a tag can be submitted again by hand. A workflow_dispatch is
  # one of the two events GITHUB_TOKEN may start.
  clipper-chrome-zip:
    name: Clipper Chrome zip
    needs: release-please
    # !cancelled(): on a manual run release-please is skipped, which would skip
    # this job too.
    if: ${{ !cancelled() && (needs.release-please.outputs.clipper_released == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ inputs.clipper_tag || needs.release-please.outputs.clipper_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/setup-project

      - name: Build the zip
        env:
          # The public phc_ project key (infra/posthog), not a secret.
          VITE_POSTHOG_KEY: ${{ vars.CLIPPER_POSTHOG_KEY }}
          # The full /graphql URL of the production API.
          VITE_API_URL: ${{ vars.CLIPPER_API_URL }}
          # The web app's origin, e.g. https://www.trakwyn.com (not the API's).
          VITE_WEB_URL: ${{ vars.CLIPPER_WEB_URL }}
        run: |
          test -n "$VITE_POSTHOG_KEY" || { echo "::error::Repository variable CLIPPER_POSTHOG_KEY is not set"; exit 1; }
          test -n "$VITE_API_URL" || { echo "::error::Repository variable CLIPPER_API_URL is not set"; exit 1; }
          test -n "$VITE_WEB_URL" || { echo "::error::Repository variable CLIPPER_WEB_URL is not set"; exit 1; }
          rm -f apps/extension/.env
          pnpm --filter @trakwyn/extension zip

      # The tag, the manifest, the bundle's URLs and the nothing-added-since-the-
      # previous-release comparison are shared with the Firefox job
      # (.github/actions/clipper-release-guard, JEF-479). A permission or
      # content-script host added in an update disables the extension for
      # every user until they re-approve it, and it is submitted for review
      # below without a person looking at the package.
      - name: Check the Chrome zip
        id: guard
        uses: ./.github/actions/clipper-release-guard
        with:
          tag: ${{ env.TAG }}
          zip-glob: '*-chrome.zip'
          store: Chrome
          api-url: ${{ vars.CLIPPER_API_URL }}
          web-url: ${{ vars.CLIPPER_WEB_URL }}
          manual-hint: release this one by hand

      - name: Attach the zip to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.guard.outputs.zip }}" --clobber

      - name: Start the Web Store submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clipper-cws.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$TAG"

  # The Firefox half of a Clipper release (JEF-437): builds the add-on and the
  # sources zip AMO asks for, from the same tag, checks the manifest and that
  # nothing was added since the previous release, attaches both to the GitHub
  # Release and starts clipper-amo.yml, which submits them to AMO with no
  # further step (JEF-458). AMO publishes an approved version straight away, as
  # the Web Store does with DEFAULT_PUBLISH, so these checks are the only ones
  # before review. The submission is its own workflow so a tag can be submitted
  # again by hand, and so the AMO secrets stay in the `amo` environment. A
  # workflow_dispatch is one of the two events GITHUB_TOKEN may start.
  clipper-firefox-zip:
    name: Clipper Firefox zips
    needs: release-please
    # !cancelled(): on a manual run release-please is skipped, which would skip
    # this job too.
    if: ${{ !cancelled() && (needs.release-please.outputs.clipper_released == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ inputs.clipper_tag || needs.release-please.outputs.clipper_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/setup-project

      - name: Build the Firefox zips
        env:
          # The public phc_ project key (infra/posthog), not a secret.
          VITE_POSTHOG_KEY: ${{ vars.CLIPPER_POSTHOG_KEY }}
          # The full /graphql URL of the production API.
          VITE_API_URL: ${{ vars.CLIPPER_API_URL }}
          # The web app's origin, e.g. https://www.trakwyn.com (not the API's).
          VITE_WEB_URL: ${{ vars.CLIPPER_WEB_URL }}
        run: |
          test -n "$VITE_POSTHOG_KEY" || { echo "::error::Repository variable CLIPPER_POSTHOG_KEY is not set"; exit 1; }
          test -n "$VITE_API_URL" || { echo "::error::Repository variable CLIPPER_API_URL is not set"; exit 1; }
          test -n "$VITE_WEB_URL" || { echo "::error::Repository variable CLIPPER_WEB_URL is not set"; exit 1; }
          rm -f apps/extension/.env
          pnpm --filter @trakwyn/extension zip:firefox

      - name: Check the Firefox zip
        id: guard
        uses: ./.github/actions/clipper-release-guard
        with:
          tag: ${{ env.TAG }}
          zip-glob: '*-firefox.zip'
          store: Firefox
          api-url: ${{ vars.CLIPPER_API_URL }}
          web-url: ${{ vars.CLIPPER_WEB_URL }}
          manual-hint: submit this one to AMO by hand

      # What only the Firefox manifest has to satisfy.
      - name: Check the Firefox manifest
        env:
          ZIP: ${{ steps.guard.outputs.zip }}
        run: |
          sources=$(ls apps/extension/.output/*-sources.zip)
          manifest=$(unzip -p "$ZIP" manifest.json)
          # The Chrome key belongs to the Web Store listing only.
          if jq -e 'has("key")' <<<"$manifest" >/dev/null; then
            echo "::error::Firefox manifest has the Chrome key"; exit 1
          fi
          # A grown permission list prompts every installed copy on update.
          jq -e '.permissions == ["storage", "activeTab", "tabs"]' <<<"$manifest" >/dev/null || {
            echo "::error::Firefox permissions changed: $(jq -c .permissions <<<"$manifest")"; exit 1
          }
          # The add-on ID is permanent: a different one is a different add-on.
          jq -e '.browser_specific_settings.gecko.id == "clipper@trakwyn.com"' <<<"$manifest" >/dev/null || {
            echo "::error::Gecko ID is not clipper@trakwyn.com"; exit 1
          }
          echo "SOURCES_ZIP=$sources" >> "$GITHUB_ENV"

      - name: Attach the zips to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.guard.outputs.zip }}" "$SOURCES_ZIP" --clobber

      - name: Start the AMO submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clipper-amo.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$TAG"
