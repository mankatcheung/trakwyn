name: Mobile E2E (Android)

# The seven Maestro flows on an Android emulator. Like the iOS job, this runs
# nightly, on demand, and on any pull request carrying the `run-android-e2e`
# label, not on every PR: it costs a native build plus an emulator boot, and it
# was advisory anyway. A red night sends an ntfy push (NTFY_TOPIC).
#
# It lives in its own file for the same reason mobile-e2e-ios.yml does: ci.yml
# deploys, and a schedule or a `labeled` trigger does not belong there.

on:
  schedule:
    # 03:30 UTC, after the day's merges and half an hour behind the iOS run.
    - cron: '30 3 * * *'
  workflow_dispatch:
  # No pull_request trigger while the mobile app is unreleased: the job only
  # ever showed as skipped (or action_required on release-please PRs). Restore
  # `pull_request` (branches: [main], types: [opened, synchronize, reopened,
  # labeled]) to bring back the `run-android-e2e` label.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e-android:
    name: Mobile E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project

      # Pinned rather than tracking whatever the runner image ships: there is no
      # android/ directory in the repo, so every run regenerates the native
      # project, and an Expo SDK bump that changes the required JDK should fail
      # here loudly rather than drift (JEF-300, R-4).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      # The same ephemeral configuration the Playwright job writes. Every
      # provider that would need a secret is faked, which is what lets this job
      # run on a pull request from a fork — GitHub withholds secrets there, and
      # any device-farm option would have needed an access key (R-7).
      - name: Configure ephemeral E2E environment
        run: |
          cat > apps/api/.env <<'EOF'
          PORT=3001
          NODE_ENV=development
          DATABASE_URL=pglite:${{ runner.temp }}/trakwyn-mobile-e2e-pglite
          JWT_SECRET=e2e-only-jwt-secret
          JWT_REFRESH_SECRET=e2e-only-refresh-secret
          TOTP_ENCRYPTION_KEY=e2e-only-totp-encryption-key
          LLM_API_KEY_ENCRYPTION_KEY=e2e-only-llm-encryption-key
          STORAGE_PROVIDER=local
          CACHE_PROVIDER=memory
          EMAIL_PROVIDER=console
          CORS_ORIGIN=http://localhost:3000
          WEB_APP_ORIGIN=http://localhost:3000
          API_ORIGIN=http://localhost:3001
          COOKIE_DOMAIN=
          GOOGLE_OAUTH_CLIENT_ID=e2e-fake-google-client-id
          GITHUB_OAUTH_CLIENT_ID=e2e-fake-github-client-id
          OAUTH_PROVIDER_MODE=fake
          LLM_PROVIDER_MODE=fake
          EOF

      - name: Run database migrations
        run: pnpm --filter @trakwyn/api db:migrate:apply

      - name: Start the API
        run: |
          pnpm --filter @trakwyn/api dev > "${{ runner.temp }}/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -X POST -H 'content-type: application/json' \
              -d '{"query":"{ __typename }"}' http://localhost:3001/graphql >/dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the API never answered on :3001"
          cat "${{ runner.temp }}/api.log"
          exit 1

      # EXPO_PUBLIC_API_URL is inlined into the bundle by Metro, not read at
      # launch (apps/mobile/src/constants.ts), so it has to be set here — after
      # the build there is no way to point the app anywhere else. 10.0.2.2 is
      # the emulator's route to the runner's own localhost.

      - name: Build the release APK
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3001/graphql
        run: |
          pnpm exec expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --build-cache

      # Two facts the flows cannot report about the binary they drive: whether
      # the manifest allows the cleartext API URL (apps/mobile/plugins/
      # withCleartextForHttpApi.js), and whether Metro inlined that URL at all —
      # a build that lost EXPO_PUBLIC_API_URL falls back to localhost, which on
      # the emulator is the emulator, and fails with the same symptom.
      - name: Inspect the release APK
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          aapt2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          echo "usesCleartextTraffic in the manifest:"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -i cleartext || echo "  (absent)"
          echo "API URLs in the JS bundle:"
          unzip -p "$apk" assets/index.android.bundle \
            | grep -a -o -E 'https?://[A-Za-z0-9.-]+(:[0-9]+)?/graphql' | sort | uniq -c \
            || echo "  (none found)"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # The installer tracks latest; record which one this run got.
          "$HOME/.maestro/bin/maestro" --version

      # Hardware acceleration. Without it the emulator falls back to software
      # rendering and the job goes from minutes to tens of minutes.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache the AVD snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      # Creating the AVD and booting it cold costs a couple of minutes every
      # run; this does it once and caches the snapshot so later runs resume it.
      - name: Create the AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created"

      - name: Run the Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One line, deliberately: the action runs each line of `script` as
          # its own `sh -c`, so a multi-line script cannot carry Maestro's exit
          # status to a later line — see the script's header.
          script: bash .github/scripts/mobile-e2e-android.sh

      # Recordings, view hierarchy dumps and the command log for whichever flow
      # failed — the mobile equivalent of the Playwright report, and the reason
      # a red run here is diagnosable without re-running it locally (G-8).
      # Maestro writes under a *hidden* `.maestro/tests/<run>/<flow>/` tree
      # inside --debug-output (screenshots, screen hierarchy, device logcat),
      # and upload-artifact skips hidden files unless told otherwise — which
      # is why three artifacts in a row held only api.log. Uploaded on every
      # outcome: a green run's logs are the baseline the next red one is read
      # against.
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/maestro-debug/
            ${{ runner.temp }}/api.log
          if-no-files-found: ignore

      # Nobody is waiting on a PR check, so a red night has to reach someone.
      - name: Notify via ntfy on failure
        if: failure() && github.event_name == 'schedule'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS \
            -H "Title: Android E2E failed" \
            -H "X-Click: ${RUN_URL}" \
            -d "Nightly Maestro run failed: ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}"
