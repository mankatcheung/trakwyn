name: Clipper on Firefox Add-ons

# Submits a Clipper release to addons.mozilla.org (JEF-437). release.yml's
# clipper-firefox-zip job builds the add-on and its sources zip from the
# release tag, checks the manifest and that no permission or content-script
# host was added since the previous release, attaches both to the GitHub
# Release and starts this workflow with that tag. Run it by hand (Actions >
# Clipper on Firefox Add-ons > Run workflow) to submit a tag again.
#
# It submits with no manual step (JEF-458), like the Web Store job: a listed
# version goes to AMO's review and is published as soon as AMO passes it, with
# no staged rollout. The checks in clipper-firefox-zip are what stand before
# that review, so do not run this for a tag whose zips did not come from it.
#
# The job runs in the `amo` environment so the AMO secrets are readable by
# this job alone, from the default branch only. Keep the environment.
#
# One-time setup (apps/extension/CLAUDE.md, "Firefox"): the FIREFOX_JWT_ISSUER
# and FIREFOX_JWT_SECRET secrets from AMO's Developer Hub (Manage API Keys), as
# secrets of the `amo` environment.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Clipper release tag to submit, e.g. clipper-v1.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  clipper-amo:
    name: Submit to Firefox Add-ons
    runs-on: ubuntu-latest
    environment: amo
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^clipper-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::$TAG is not a clipper-v<major>.<minor>.<patch> tag"; exit 1
          }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: ./.github/actions/setup-project

      # The zips release.yml checked, not a rebuild: what was checked is what
      # AMO gets.
      - name: Download the zips from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern '*-firefox.zip' --pattern '*-sources.zip' --dir amo
          echo "ZIP=$(ls "$GITHUB_WORKSPACE"/amo/*-firefox.zip)" >> "$GITHUB_ENV"
          echo "SOURCES_ZIP=$(ls "$GITHUB_WORKSPACE"/amo/*-sources.zip)" >> "$GITHUB_ENV"

      # Listed, so it goes to review and on to the public listing once it passes.
      # Desktop only: Firefox for Android has not been tested, and its first
      # version that reads data_collection_permissions (142) is newer than the
      # manifest's strict_min_version.
      - name: Submit to AMO
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          pnpm --filter @trakwyn/extension exec wxt submit \
            --firefox-zip "$ZIP" \
            --firefox-sources-zip "$SOURCES_ZIP" \
            --firefox-extension-id clipper@trakwyn.com \
            --firefox-channel listed \
            --firefox-compatibility firefox
