name: Guide environment
# Run actions/checkout and ./.github/actions/setup-project BEFORE this action.
#
# Builds the API and web app and seeds the demo account, so a guide script
# (JEF-532) can run against them. Shared by guides-draft.yml and
# guides-freshness.yml (JEF-533). Guides are captured only from the seeded demo
# account, never from real data.
#
# The database is PGlite (an in-process Postgres in apps/api/.pglite), not a
# container: these jobs run a few times a month, so the e2e job's Postgres and
# registry mirror are not worth the extra setup. The values written to .env are
# throwaway; their `e2e-only-` prefix is what .gitleaks.toml allows.
description: Install Chromium, write a throwaway env, migrate, build and seed the demo account

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Chromium
      shell: bash
      run: pnpm --filter @trakwyn/web exec playwright install --with-deps chromium

    - name: Configure the throwaway environment
      shell: bash
      run: |
        cat > apps/api/.env <<'ENV'
        PORT=3001
        NODE_ENV=development
        DATABASE_URL=pglite:./.pglite
        JWT_SECRET=e2e-only-jwt-secret
        JWT_REFRESH_SECRET=e2e-only-refresh-secret
        TOTP_ENCRYPTION_KEY=e2e-only-totp-encryption-key
        LLM_API_KEY_ENCRYPTION_KEY=e2e-only-llm-encryption-key
        STORAGE_PROVIDER=local
        CACHE_PROVIDER=memory
        EMAIL_PROVIDER=console
        CORS_ORIGIN=http://localhost:3000
        WEB_APP_ORIGIN=http://localhost:3000
        API_ORIGIN=http://localhost:3001
        COOKIE_DOMAIN=
        GOOGLE_OAUTH_CLIENT_ID=e2e-fake-google-client-id
        GITHUB_OAUTH_CLIENT_ID=e2e-fake-github-client-id
        OAUTH_PROVIDER_MODE=fake
        LLM_PROVIDER_MODE=fake
        ENV

        cat > apps/web/.env <<'ENV'
        VITE_API_URL=/graphql
        ENV

    - name: Migrate, build and seed
      shell: bash
      env:
        # Skips the Vercel-only nitro output, which `vite preview` cannot serve.
        E2E_PLAIN_BUILD: '1'
      run: |
        pnpm --filter @trakwyn/api db:migrate:apply
        pnpm --filter @trakwyn/api build
        pnpm --filter @trakwyn/web build
        pnpm --filter @trakwyn/api db:seed
