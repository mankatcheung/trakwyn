name: Base images
description: >
  Logs in to the base-images Artifact Registry repo as a Google service
  account and exports NODE_IMAGE and POSTGRES_IMAGE, the mirrored images pinned
  in infra/base-images.txt (JEF-406, JEF-407). The caller checks out the
  repository first and grants `id-token: write`.

inputs:
  project-id:
    description: GCP project that holds the repo (vars.GCP_PROJECT_ID).
    required: true
  workload-identity-provider:
    description: vars.GCP_WIF_PROVIDER.
    required: true
  service-account:
    description: The account to act as. CI jobs use the read-only vars.GCP_CI_READER_SA.
    required: true
  registry:
    description: Artifact Registry host.
    default: europe-west1-docker.pkg.dev
  preload:
    description: >
      Space-separated pin names (e.g. `postgres`) the job runs with
      `docker run`. They are kept in the Actions cache as a `docker save`
      tarball keyed on infra/base-images.txt, so only a changed pin pulls from
      Artifact Registry (JEF-474), and the matching *_IMAGE variable points at
      the local copy. Leave empty for jobs that only hand the reference to
      buildx, which cannot see the daemon's images.
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve the mirrored images
      shell: bash
      env:
        DEST: ${{ inputs.registry }}/${{ inputs.project-id }}/base-images
      run: |
        {
          echo "NODE_IMAGE=$(.github/scripts/base-image-ref.sh node "$DEST")"
          echo "POSTGRES_IMAGE=$(.github/scripts/base-image-ref.sh postgres "$DEST")"
        } >> "$GITHUB_ENV"

    - id: cache
      if: inputs.preload != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/base-images-cache
        key: base-images-${{ runner.os }}-${{ inputs.preload }}-${{ hashFiles('infra/base-images.txt') }}

    # Nothing below talks to the registry when the cache already holds every
    # preloaded image and the job does not hand a reference to buildx.
    - id: auth
      if: inputs.preload == '' || steps.cache.outputs.cache-hit != 'true'
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
        token_format: access_token

    - if: steps.auth.outcome == 'success'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ inputs.registry }}
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Load or pull the preloaded images
      if: inputs.preload != ''
      shell: bash
      env:
        DEST: ${{ inputs.registry }}/${{ inputs.project-id }}/base-images
        HIT: ${{ steps.cache.outputs.cache-hit }}
        PRELOAD: ${{ inputs.preload }}
        CACHE_DIR: ${{ runner.temp }}/base-images-cache
      run: |
        mkdir -p "$CACHE_DIR"
        for name in $PRELOAD; do
          ref="$(.github/scripts/base-image-ref.sh "$name" "$DEST")"
          # A digest reference carries no tag, so a saved image would load
          # nameless. Tag it locally and run that name.
          local_ref="trakwyn-ci/$name:cached"
          tarball="$CACHE_DIR/$name.tar"
          if [[ "$HIT" == "true" ]]; then
            docker load --input "$tarball"
          else
            docker pull "$ref"
            docker tag "$ref" "$local_ref"
            docker save --output "$tarball" "$local_ref"
          fi
          echo "${name^^}_IMAGE=$local_ref" >> "$GITHUB_ENV"
        done
