name: Setup project
# Run actions/checkout@v4 BEFORE this action — local composite actions cannot be
# resolved without the repo checked out first.
#
description: Install pnpm, setup Node.js, install dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 12.16.1

    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
